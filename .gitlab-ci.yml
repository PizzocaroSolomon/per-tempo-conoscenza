# Publishes the signed package on GitLab Pages. GitLab Pages compresses nothing by itself:
# it serves the .gz copies made here to the clients that accept gzip.
pages:
  image: alpine:3.22
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - mkdir public
    - cp -r conoscenza.json conoscenza.json.firma officina public/
    - find public -type f -name '*.json' -exec gzip -k -9 {} +
  artifacts:
    paths: [public]
